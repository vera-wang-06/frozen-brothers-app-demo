name: Publish demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build app
        env:
          GITHUB_PAGES: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: |
          project_dir=""
          while IFS= read -r manifest; do
            candidate="$(dirname "$manifest")"
            if [ -f "$candidate/App.js" ] && [ -f "$candidate/package-lock.json" ]; then
              if [ -n "$project_dir" ]; then
                echo "Multiple app folders found; keep only one complete app"
                exit 1
              fi
              project_dir="$candidate"
            fi
          done < <(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' -not -path './.git/*')
          if [ -z "$project_dir" ]; then
            echo "Cannot find a complete app with App.js and package-lock.json"
            exit 1
          fi
          echo "PAGES_OUTPUT=$project_dir/dist" >> "$GITHUB_ENV"
          cd "$project_dir"
          npm ci
          npm test
          npx expo export --platform web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_OUTPUT }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
